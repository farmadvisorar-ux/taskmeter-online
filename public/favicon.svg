<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Electric Indigo to Vivid Cyber Purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Beveled Translucent Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Inner Radial Lighting for High-End Glass Look -->
    <radialGradient id="innerGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Dynamic Dial Needle Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Precision Meter Arc Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#6ee7b7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="1"/>
    </linearGradient>

    <!-- Outer Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4338ca" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS-Style Curvature Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" filter="url(#iconShadow)"/>
  
  <!-- Subtle Internal Radial Depth -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#innerGlow)"/>
  
  <!-- Polished Outer Glass Rim -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Meter Gauge Inactive Baseline Track -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8"/>

  <!-- Active Metering Velocity Arc (~280 degrees sweep) -->
  <path d="M 64 26 A 38 38 0 1 1 35.8 89.6" fill="none" stroke="url(#trackGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Leading Calibrated Indicator Pip -->
  <circle cx="64" cy="26" r="6" fill="#34d399"/>
  <circle cx="64" cy="26" r="3" fill="#ffffff"/>

  <!-- Hour Hand: Precision Engineered Vertical White Bar -->
  <line x1="64" y1="64" x2="64" y2="40" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Minute / Value Hand: Bold Billable Accent pointing dynamically -->
  <line x1="64" y1="64" x2="85" y2="75" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Center Pivot Core -->
  <circle cx="64" cy="64" r="8" fill="#ffffff"/>
  <circle cx="64" cy="64" r="3.5" fill="#4f46e5"/>
</svg>